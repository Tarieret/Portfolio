<body>

  <a href="index.html" class="nav-mark">Tariere Timitimi</a>

      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="20" height="10" rx="5"/><circle id="knob" cx="7" cy="12" r="3" fill="currentColor"/></svg>

<main class="page gallery-page">
  <header class="page-head">
    <h1>Gallery</h1>
    <p class="sub">Generative art made with Python plotting libraries. One new piece a month.</p>
  </header>

  <div class="ggrid">

    <!--
      HOW TO ADD A PIECE (newest first, paste above the previous one):
      - Pieces are square; images are cropped to fit a square frame.
      - One image: use a single <img> with no art-dark/art-light class.
      - Theme-aware pair: two <img>s with class "art-dark" and "art-light".
      - Delete the Code / Process links until they exist.
    -->

    <figure class="piece">
      <button class="frame" type="button" aria-label="Enlarge Contours">
        <img class="art-dark" src="assets/img/banner-dark.svg" alt="Layered contour lines from a 2-D kernel density estimate in pink, purple, teal, sage and yellow on a dark background" loading="lazy">
        <img class="art-light" src="assets/img/banner-light.svg" alt="Layered contour lines from a 2-D kernel density estimate on a light background" loading="lazy">
      </button>
      <figcaption>
        <h2>Contours</h2>
        <p class="meta">2-D kernel density estimate · matplotlib · Nov 2026 · made with Claude</p>
        <div class="links">
          <!-- <a href="https://github.com/Tarieret/gallery/tree/main/2026-11-contours" target="_blank" rel="noopener">Code &rarr;</a> -->
          <!-- <a href="https://tarieretimitimi.substack.com/p/..." target="_blank" rel="noopener">Process &rarr;</a> -->
        </div>
      </figcaption>
    </figure>

  </div>
</main>

<dialog class="lightbox" id="lightbox">
  <button class="icon-btn lb-close" type="button" aria-label="Close">
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <img id="lbImg" alt="">
  <p id="lbCap"></p>
</dialog>

<footer>&copy; 2026 Tariere Timitimi</footer>

<script src="assets/site.js"></script>
<script>
// Lightbox: opens the version matching the current theme
(function () {
  var lb = document.getElementById('lightbox');
  var img = document.getElementById('lbImg');
  var cap = document.getElementById('lbCap');
  if (!lb || !lb.showModal) return;
  document.querySelectorAll('.piece .frame').forEach(function (f) {
    f.addEventListener('click', function () {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      var src = f.querySelector(dark ? '.art-dark' : '.art-light') || f.querySelector('img');
      img.src = src.currentSrc || src.src;
      img.alt = src.alt;
      cap.textContent = f.closest('.piece').querySelector('h2').textContent;
      lb.showModal();
    });
  });
  lb.addEventListener('click', function (e) {
    if (e.target === lb || e.target.closest('.lb-close')) lb.close();
  });
})();
</script>
</body>
</html>
